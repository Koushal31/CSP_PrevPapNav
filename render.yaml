services:
  - type: web
    name: csp-prevpapnav
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong secret
      - key: MONGO_URI
        sync: false                # set in the Render dashboard
      - key: MONGO_DB_NAME
        value: previous_papers_navigator
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
