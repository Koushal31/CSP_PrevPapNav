{% extends "base.html" %}
{% block title %}Reset Password – PapersNav{% endblock %}
{% block content %}

<section class="auth-section">
  <div class="auth-container auth-narrow">
    <div class="auth-brand">
      <i class="fas fa-lock"></i>
      <h2>Set a new password</h2>
      {% if email %}<p>Enter the code sent to<br/><strong>{{ email }}</strong></p>{% endif %}
    </div>

    {% if error %}
      <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.reset_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input type="hidden" name="email" value="{{ email }}"/>
      <div class="form-group">
        <label>Reset code</label>
        <input type="text" name="otp" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required class="otp-input"/>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" minlength="6" placeholder="At least 6 characters" required/>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" minlength="6" placeholder="Re-enter the password" required/>
      </div>
      <button type="submit" class="btn-primary btn-full btn-lg"><i class="fas fa-check"></i> Reset password</button>
    </form>

    <p class="auth-switch"><a class="link-btn" href="{{ url_for('auth.forgot_password') }}">Request a new code</a></p>
  </div>
</section>

{% endblock %}
