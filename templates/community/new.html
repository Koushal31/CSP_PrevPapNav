{% extends "base.html" %}
{% block title %}New Post – PapersNav{% endblock %}
{% block content %}
{% set form = form or {} %}

<section class="page-hero small">
  <div class="section-container">
    <a href="{{ url_for('community.index') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Community</a>
  </div>
</section>

<section class="community-section">
  <div class="community-narrow">
    <div class="post-form-card">
      <h2><i class="fas fa-pen-to-square"></i> Create a post</h2>
      <form method="POST" action="{{ url_for('community.new') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
          <label>Title <span class="req">*</span></label>
          <input type="text" name="title" maxlength="160" value="{{ form.get('title','') }}"
                 placeholder="A clear, specific title" required/>
        </div>
        <div class="form-group">
          <label>Details</label>
          <textarea name="body" rows="8" maxlength="5000" placeholder="Share more details, ask your question, or add context…">{{ form.get('body','') }}</textarea>
        </div>
        <div class="post-form-actions">
          <a href="{{ url_for('community.index') }}" class="btn-ghost">Cancel</a>
          <button type="submit" class="btn-primary btn-lg"><i class="fas fa-paper-plane"></i> Post</button>
        </div>
      </form>
    </div>
  </div>
</section>

{% endblock %}
